{{- if .Values.monitoring.metricbeat.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-metricbeat-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
data:
  metricbeat.yml: |
    metricbeat.modules:
      - module: logstash
        xpack.enabled: true
        {{- if not .Values.monitoring.metricbeat.metricsets }}
        {{- fail "monitoring.metricbeat.metricsets must not be empty" }}
        {{- end }}
        metricsets:
        {{- range .Values.monitoring.metricbeat.metricsets }}
          - {{ . }}
        {{- end }}
        period: {{ .Values.monitoring.metricbeat.period }}
        hosts: ["https://localhost:9600"]
        ssl.verification_mode: none

    processors:
{{- if .Values.monitoring.metricbeat.clusterName }}
      - add_fields:
          target: ""
          fields:
            orchestrator.cluster.name: ${CLUSTER_NAME}
{{- end }}
      - add_host_metadata: ~
      - add_cloud_metadata: ~

    output.elasticsearch:
      hosts: ["{{ .Values.monitoring.metricbeat.elasticsearchHost }}"]
      username: ${MONITOR_ES_USERNAME}
      password: ${MONITOR_ES_PASSWORD}
      ssl.verification_mode: "none"
      protocol: "https"

    setup.template.settings:
      index.number_of_shards: 1
      index.codec: best_compression
{{- end }}
