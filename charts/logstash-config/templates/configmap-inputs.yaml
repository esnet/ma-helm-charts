{{- $prefix := .Values.pipeline.prefix -}}
{{- $filename := printf "%s-%s-inputs.conf" $prefix (include "logstash.pad3" 1) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-inputs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
data:
  {{ $filename }}: |
    input {
        kafka {
            bootstrap_servers => "${kafka_input_bootstrap_servers}"
            topics => ["${kafka_input_topic}"]
            decorate_events => "basic"
            codec => "json"
            auto_offset_reset => "${kafka_input_auto_offset_reset}"
            group_id => "${kafka_input_group_id}"
            client_id => "${pod_name}"
            consumer_threads => "${kafka_input_consumer_threads}"
            max_poll_records => "${kafka_input_max_poll_records}"
            max_poll_interval_ms => "${kafka_input_max_poll_interval_ms}"
            sasl_mechanism => "SCRAM-SHA-512"
            security_protocol => "SASL_SSL"
            sasl_jaas_config => "org.apache.kafka.common.security.scram.ScramLoginModule required username='${kafka_input_sasl_username}' password='${kafka_input_sasl_password}';"
{{- if .Values.kafka.ssl.enabled }}
            ssl_truststore_location => {{ .Values.kafka.ssl.truststoreLocation | quote }}
            ssl_truststore_type => {{ .Values.kafka.ssl.truststoreType | quote }}
{{- if .Values.kafka.ssl.truststorePassword }}
            ssl_truststore_password => {{ .Values.kafka.ssl.truststorePassword | quote }}
{{- end }}
            ssl_endpoint_identification_algorithm => {{ .Values.kafka.ssl.endpointIdentificationAlgorithm | quote }}
{{- end }}
        }
    }
