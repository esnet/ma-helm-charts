# CI fixture: pipeline.sources mixing configMap, inline, and fromImage types.
namespace: mixed-pipeline
create_ns: true

image:
  repository: us-central1-docker.pkg.dev/ma-infrastructure-474617/docker-registry/stardust/my-pipeline
  tag: "2.0.0"

replicas: 1

pipeline:
  prefix: mix
  sources:
    - index: 20
      configMap: mix-initial-format
    - index: 50
      inline: |
        filter {
          mutate { add_field => { "source" => "mixed" } }
        }
    - index: 80
      fromImage: "/usr/share/logstash/pipeline-src/mix-080-custom.conf"

kafka:
  enabled: true
  bootstrapServers: "kafka:9092"
  topic: mix-topic
  groupId: mix-group

elasticsearch:
  enabled: false

credentials:
  secretName: mix-credentials
