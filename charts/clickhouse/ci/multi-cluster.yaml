# Multiple logical clusters on the same CHI/Keeper ensemble.
# Exercises the clusters map with different shard/replica counts and schema policies.
namespace: clickhouse

config:
  tls:
    enabled: false
    routes: false
    cert_name: tls-cert

  clickhouse_version: "25.9"

  chk:
    name: keeper-cluster
    resources:
      replicasCount: 3
      disk_volume:
        size: 20Gi
      requests:
        memory: 256M
        cpu: 1
      limits:
        memory: 4Gi
        cpu: 2

  ch:
    installation_name: ch-cluster
    monitoring:
      enabled: false
    clusters:
      ch-cluster:
        shards: 1
        replicas: 2
      analytics:
        shards: 3
        replicas: 2
        schema_policy:
          replica: None
          shard: None
    users:
      admin:
        password_secret:
          name: clickhouse-users
          key: admin_password
        access_management: 1
    resources:
      disk_volume:
        size: 100Gi
      log_volume:
        size: 10Gi
      max_concurrent_queries: 100
      requests:
        memory: 8Gi
        cpu: 2
      limits:
        memory: 16Gi
        cpu: 4
