{{- $bootstrapImage := .Values.config.gateway.bootstrap.image | default "alpine/k8s:1.36.2" }}
---
# Bootstrap ServiceAccount – runs as an ArgoCD PreSync hook to break the
# Envoy/GKE Gateway / cert-manager chicken-and-egg race condition.
# The Job creates a self-signed TLS Secret before the main sync so the
# Gateway can provision.  cert-manager replaces it with the real
# Let's Encrypt cert once the Gateway is live and the HTTP01 challenge
# can be served.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-bootstrap-sa
  namespace: {{ .Values.config.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-bootstrap-role
  namespace: {{ .Values.config.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-bootstrap-rb
  namespace: {{ .Values.config.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-bootstrap-role
subjects:
  - kind: ServiceAccount
    name: cert-bootstrap-sa
    namespace: {{ .Values.config.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-bootstrap
  namespace: {{ .Values.config.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
    helm.sh/hook-weight: "2"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: cert-bootstrap-sa
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ $bootstrapImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              NAMESPACE="{{ .Values.config.namespace }}"
              SECRET_NAME="{{ .Values.config.certificate.name }}"

              echo "Checking if TLS Secret '${SECRET_NAME}' already exists..."

              if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" > /dev/null 2>&1; then
                echo "TLS Secret '${SECRET_NAME}' already exists - skipping bootstrap."
                exit 0
              fi

              echo "TLS Secret not found. Generating self-signed bootstrap certificate..."

              # Self-signed cert valid for 2 days - only needs to keep the GKE
              # Gateway happy until cert-manager issues the real certificate.
              openssl req -x509 -newkey rsa:2048 \
                -keyout /tmp/tls.key \
                -out /tmp/tls.crt \
                -days 2 \
                -nodes \
                -subj "/CN={{ index .Values.config.domains 0 }}"

              echo "Creating bootstrap TLS Secret..."

              kubectl create secret tls "${SECRET_NAME}" \
                -n "${NAMESPACE}" \
                --cert=/tmp/tls.crt \
                --key=/tmp/tls.key

              echo "Annotating bootstrap TLS Secret..."

              kubectl annotate secret "${SECRET_NAME}" \
                -n "${NAMESPACE}" \
                cert-manager.io/bootstrap=true \
                "cert-manager.io/certificate-name=${SECRET_NAME}"

              echo "Bootstrap TLS Secret '${SECRET_NAME}' created successfully."
