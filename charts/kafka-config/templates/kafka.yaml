apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.config.kafka.clusterName }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    {{- include "kafka.componentLabels" (list . "kafka") | nindent 4 }}
spec:
  kafka:
    version: {{ .Values.config.kafka.version | default .Chart.AppVersion | quote }}
    listeners:
      {{- range $name, $listener := .Values.config.kafka.listeners }}
      - name: {{ $name }}
        port: {{ $listener.port }}
        type: {{ $listener.type }}
        tls: {{ $listener.tls }}
        {{- if $listener.authentication }}
        authentication:
          type: {{ $listener.authentication.type }}
          {{- if $listener.authentication.sasl }}
          sasl: {{ $listener.authentication.sasl }}
          {{- end }}
        {{- end }}
        {{- if $listener.configuration }}
        configuration:
          {{- if $listener.configuration.bootstrap }}
          bootstrap:
            {{- if $listener.configuration.bootstrap.annotations }}
            annotations:
              {{- range $k, $v := $listener.configuration.bootstrap.annotations }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $listener.configuration.ipFamilyPolicy }}
          ipFamilyPolicy: {{ $listener.configuration.ipFamilyPolicy }}
          {{- end }}
          {{- if $listener.configuration.ipFamilies }}
          ipFamilies:
            {{- range $listener.configuration.ipFamilies }}
            - {{ . }}
            {{- end }}
          {{- end }}
          {{- if $listener.configuration.brokerAnnotations }}
          brokers:
            {{- $start := $.Values.config.keeper.broker.nodeStartId | int }}
            {{- $stop := add $start ($.Values.config.keeper.broker.replicas | int) | int }}
            {{- $ips := $listener.configuration.brokerIpAddresses }}
            {{- range $i, $id := untilStep $start $stop 1 }}
            - broker: {{ $id }}
              annotations:
                {{- range $k, $v := $listener.configuration.brokerAnnotations }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
                {{- if $ips }}
                {{- $ip := index $ips $i }}
                {{- if $ip }}
                networking.gke.io/load-balancer-ip-addresses: {{ $ip | quote }}
                {{- end }}
                {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- $superUsers := list }}
    {{- range $key, $user := .Values.config.users }}
    {{- if $user.superUser }}
    {{- $superUsers = append $superUsers (printf "CN=%s" $user.name) }}
    {{- end }}
    {{- end }}
    authorization:
      type: simple
      {{- if $superUsers }}
      superUsers:
        {{- range $superUsers }}
        - {{ . }}
        {{- end }}
      {{- end }}
    readinessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 10
    config:
      {{- range $key, $value := .Values.config.kafka.config }}
      {{ $key }}: {{ $value }}
      {{- end }}
    {{- if .Values.config.kafka.jmxOptions.enabled }}
    jmxOptions: {}
    {{- end }}
    {{- if .Values.config.kafka.metrics.enabled }}
    metricsConfig:
      type: strimziMetricsReporter
      {{- if .Values.config.kafka.metrics.allowList }}
      values:
        allowList:
          {{- range .Values.config.kafka.metrics.allowList }}
          - {{ . | quote }}
          {{- end }}
      {{- end }}
    {{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
