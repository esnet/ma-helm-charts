# External listener with brokerAnnotations but no brokerIpAddresses.
# Validates that the broker block renders with only the common annotations
# (cloud.google.com/l4-rbs: enabled) and no
# networking.gke.io/load-balancer-ip-addresses key on any broker.
config:
  kafka:
    clusterName: kafka-ci
    listeners:
      plain:
        port: 9092
        type: internal
        tls: false
      tls:
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      extusers:
        port: 9095
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
          sasl: true
        configuration:
          ipFamilyPolicy: SingleStack
          ipFamilies:
            - IPv4
          bootstrap:
            annotations:
              cloud.google.com/l4-rbs: enabled
          brokerAnnotations:
            cloud.google.com/l4-rbs: enabled
  keeper:
    broker:
      replicas: 3
      name: kafka
      nodeIds: "[100-199]"
      nodeStartId: 100
      resources:
        limits:
          cpu: "4"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      storage:
        volumes:
          - id: 0
            type: persistent-claim
            size: 10Gi
            kraftMetadata: shared
            deleteClaim: false
    controller:
      name: controller
      replicas: 3
      terminationGracePeriodSeconds: 30
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: "1"
          memory: 1Gi
      storage:
        volumes:
          - id: 0
            type: persistent-claim
            size: 10Gi
            kraftMetadata: shared
            deleteClaim: false
namespace: kafka-ci
